[package]
name = "frame-rate"
version = "0.3.0"
authors = ["Marc-Antoine Arnaud <marc-antoine.arnaud@luminvent.com>"]
description = "Library to manipulate video frame rate"
repository = "https://github.com/media-io/frame-rate"
documentation = "https://docs.rs/frame-rate"
readme = "README.md"
keywords = ["video", "SMPTE"]
license = "MIT"
edition = "2024"

[dependencies]
num-rational = "0.4"
serde = { version = "^1.0", features = ["derive"] }
utoipa = { version = "6.0.0", optional = true }

[features]
utoipa = ["dep:utoipa"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
serde_json = "^1.0"
